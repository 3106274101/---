server:
  port: 8080

spring:
  application:
    name: tradehub-api
  profiles:
    active: ${TRADEHUB_PROFILE:h2}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:db/schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

tradehub:
  jwt:
    secret: TradeHubLocalDevSecretKeyMustBeAtLeast256BitsLong!!
    expire-hours: 72
  upload:
    dir: ${user.dir}/uploads
    public-base: http://localhost:8080/files
  cors:
    origins: http://localhost:5173,http://localhost:3000
  store:
    default-site-code: fueltech

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/tradehub;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:3306/${MYSQL_DB:tradehub}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:tradehub}
    password: ${MYSQL_PASSWORD:tradehub}
