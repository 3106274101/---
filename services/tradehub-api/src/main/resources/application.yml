server:
  port: ${PORT:8080}

spring:
  application:
    name: tradehub-api
  profiles:
    active: ${TRADEHUB_PROFILE:h2}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:db/schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

tradehub:
  jwt:
    secret: ${TRADEHUB_JWT_SECRET:TradeHubLocalDevSecretKeyMustBeAtLeast256BitsLong!!}
    expire-hours: 72
  upload:
    dir: ${TRADEHUB_UPLOAD_DIR:${user.dir}/uploads}
    public-base: ${TRADEHUB_UPLOAD_PUBLIC_BASE:${RENDER_EXTERNAL_URL:http://localhost:8080}/files}
  cors:
    origins: ${TRADEHUB_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  store:
    default-site-code: ${TRADEHUB_DEFAULT_SITE_CODE:fueltech}

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/tradehub;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:tradehub}?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:tradehub}
    password: ${MYSQL_PASSWORD:tradehub}
    hikari:
      maximum-pool-size: ${MYSQL_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 600000
