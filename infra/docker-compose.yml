# Optional production-like stack. Local MVP defaults to H2 (no Docker required).
services:
  mysql:
    image: mysql:8.0
    container_name: tradehub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: tradehub
      MYSQL_DATABASE: tradehub
      MYSQL_USER: tradehub
      MYSQL_PASSWORD: tradehub
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - tradehub-mysql:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: tradehub-redis
    ports:
      - "6379:6379"

volumes:
  tradehub-mysql:
